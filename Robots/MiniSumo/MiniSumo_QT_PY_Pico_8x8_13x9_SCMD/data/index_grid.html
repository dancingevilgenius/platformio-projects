<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8×8 Grid</title>
<link rel="stylesheet" href="/css/dpad.css?v=4">
</head>

<body>

<div class="topbar">
    <select id="modeDropdown">
        <option value="grid" selected>Autonomous</option>
        <option value="dpad">RC</option>
    </select>
    <button type="button" id="settingsBtn" class="gear-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
    </button>
</div>

<div id="stats">
    FPS:<span id="fps"> 0</span>
    &nbsp; PKT:<span id="pkt">  0</span>
    &nbsp; LAT:<span id="lat"> 0.0</span>
</div>

<div class="grid-container">
    <div class="grid-wrapper">
        <div id="grid8x8" class="grid">

            <!-- 64 explicit grid cells -->
            <!-- Row 1 -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>

            <!-- Row 2 -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>

            <!-- Row 3 -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>

            <!-- Row 4 -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>

            <!-- Row 5 -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>

            <!-- Row 6 -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>

            <!-- Row 7 -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>

            <!-- Row 8 -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>

        </div>
        <div id="countdown" class="countdown-overlay" hidden>5</div>
    </div>
</div>

<div class="side-switch-row">
    <span id="sideLeftLabel" class="side-label is-selected">Left</span>
    <label class="switch">
        <input type="checkbox" id="sideToggle" aria-label="Starting side">
        <span class="switch-track"></span>
    </label>
    <span id="sideRightLabel" class="side-label">Right</span>
</div>
<div class="bottom-buttons match-buttons">
    <button type="button" id="btnStart" class="action-btn">Start</button>
    <button type="button" id="btnStop" class="action-btn" disabled>Stop</button>
</div>

<div id="settingsPopup" class="settings-overlay" hidden>
    <div class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <button type="button" id="settingsArrow" class="settings-arrow" aria-label="Close settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M6 6v2h8.59L5 17.59 6.41 19 16 9.41V18h2V6z"/>
            </svg>
        </button>
        <h2 id="settingsTitle">Settings</h2>
        <div class="bottom-buttons">
            <button id="btnRun" class="action-btn" type="button">Pause</button>
        </div>
        <div class="fps-row">
            <label for="fpsSlider">FPS:</label>
            <input id="fpsSlider" type="range" min="1" max="20" value="10">
        </div>
        <div class="fps-row">
            <label for="modeSelect">Mode:</label>
            <select id="modeSelect">
                <option value="0">Full RGB</option>
                <option value="1">Bitmask</option>
            </select>
        </div>
        <div class="fps-row">
            <label for="sensorSelect">Sensors:</label>
            <select id="sensorSelect">
                <option value="both" selected>Both</option>
                <option value="edge">Edge</option>
                <option value="opponent">Opponent</option>
            </select>
        </div>
        <div class="fps-row">
            <label for="redMinSelect">Edge - Red:</label>
            <select id="redMinSelect"></select>
        </div>
        <div class="fps-row">
            <label for="yellowMinSelect">Edge - Yellow:</label>
            <select id="yellowMinSelect"></select>
        </div>
        <div class="fps-row">
            <label for="opponentMaxSelect">Opponent Max:</label>
            <select id="opponentMaxSelect"></select>
        </div>
        <div class="fps-row">
            <label for="powerSelect">Power:</label>
            <select id="powerSelect">
                <option value="25" selected>25%</option>
                <option value="50">50%</option>
                <option value="75">75%</option>
                <option value="100">100%</option>
            </select>
        </div>
        <button type="button" id="healthCheckBtn" class="action-btn">Health Check</button>
        <select id="calibrateSelect" aria-label="Calibration">
            <option value="" selected>Choose Calibration</option>
            <option value="driveLeft">Drive Left Side</option>
            <option value="driveRight">Drive Right Side</option>
            <option value="driveBoth">Drive both Sides</option>
            <option value="sensor">Calibrate Sensor</option>
        </select>
        <hr class="settings-divider">
        <button type="button" id="settingsClose" class="action-btn">Close</button>
    </div>
</div>

<div id="snackbar-container"></div>

<script src="/js/grid.js?v=10"></script>
</body>
</html>
