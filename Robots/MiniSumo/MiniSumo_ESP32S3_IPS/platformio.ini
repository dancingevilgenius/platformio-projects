; MiniSumo_ESP32S3_IPS — controller UI for Hosyond / LCDWiki ES3C28P
; ESP32-S3 N16R8 + 2.8" 240x320 ILI9341V IPS + FT6336G capacitive touch
; Hardware reference: docs/HARDWARE.md

[env:MiniSumo_ESP32S3_IPS]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  lovyan03/LovyanGFX@^1.2.0

lib_ldf_mode = deep+

; Regenerates include/BuildInfo.h (build timestamp + git commit subject).
extra_scripts = pre:scripts/gen_build_info.py
