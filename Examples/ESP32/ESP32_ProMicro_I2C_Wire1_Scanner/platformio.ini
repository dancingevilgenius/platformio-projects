; Thing_Plus_RP2040_I2C_Scanner
; SparkFun Thing Plus RP2040 I2C scanner (Wire1 / Qwiic)

[platformio]
extra_configs = ../../../platformio.shared.ini
default_envs = sparkfun-thing-plus-rp2040

[env:sparkfun-thing-plus-rp2040]
extends = common
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = sparkfun_thingplusrp2040
framework = arduino
monitor_speed = 115200
