; Maker-ESP32 Pro onboard RGB LED demo
; 4 x WS2812 on GPIO 16 (RGB1..RGB4 corners)
; https://github.com/nulllaborg/maker-esp32-pro
; Official Arduino sample: rgbTest.zip (same pin/count)

[platformio]
extra_configs = ../../../platformio.shared.ini
default_envs = maker-esp32-pro

[env:maker-esp32-pro]
extends = common
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
board_build.flash_size = 4MB

lib_deps =
    adafruit/Adafruit NeoPixel
