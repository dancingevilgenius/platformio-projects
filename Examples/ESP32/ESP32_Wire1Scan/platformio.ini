; ESP32_Wire1Scan
; I2C scanner (Wire1 on classic ESP32; Wire on ESP32-C3)

[platformio]
extra_configs = ../../../platformio.shared.ini
default_envs = esp32-c3-promicro

; ESP32-C3 Pro Micro (native USB). Same board recipe as
; Examples/ESP32/ESP32_C3_ProMicro_WebServer_DPad
[env:esp32-c3-promicro]
extends = common
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 921600
monitor_filters = direct
monitor_eol = CRLF
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Original ESP32 Dev Module (two I2C peripherals; uses Wire1)
[env:esp32dev]
extends = common
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
